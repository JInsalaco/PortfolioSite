version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 / rolldown import `styleText` from `node:util`, which only exists
        # on Node >= 20.12. The default Amplify image ships an older Node, so pin 22
        # (also this project's `engines` floor) before installing or building.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
